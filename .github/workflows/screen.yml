name: US Dual-Timeframe DXDX Pullback Radar

on:
  schedule:
    # Weekdays, after the US regular session and Yahoo finalisation window.
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      test_email:
        description: Send Gmail SMTP connectivity test only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Restore alert state
        if: github.event.inputs.test_email != 'true'
        uses: actions/cache/restore@v4
        with:
          path: alert_state.json
          key: dxdx-alert-state-${{ github.run_id }}
          restore-keys: |
            dxdx-alert-state-
      - name: Scan US stocks or test Gmail
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          STRICT_BLUE_ABOVE: "false"
          MAX_WORKERS: "6"
        run: |
          if [ "${{ github.event.inputs.test_email }}" = "true" ]; then
            python main.py --test-email
          else
            python main.py
          fi
      - name: Save alert state
        if: always() && github.event.inputs.test_email != 'true' && hashFiles('alert_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: alert_state.json
          key: dxdx-alert-state-${{ github.run_id }}
      - name: Upload DXDX artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dxdx-pullback-radar
          path: |
            output/dxdx_signals.csv
            output/dxdx_report.txt
          if-no-files-found: warn
